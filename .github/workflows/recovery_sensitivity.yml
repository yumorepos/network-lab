# Bounded synthetic sensitivity, not an automated aviation optimizer.
name: Synthetic recovery sensitivity validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated solver test deps
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11' 'pytest>=8.0' -q
      - name: Check optimizer oracle, baselines and sensitivity invariants
        run: |
          python -m pytest -q tests/test_disruption_recovery_experiment.py tests/test_disruption_recovery_benchmark.py tests/test_disruption_recovery_sensitivity.py
      - name: Run finite sensitivity study and exact rerun
        run: |
          python -m experiments.disruption_recovery.sensitivity --count 30 --seed 20261111 --output sensitivity_synthetic.json
          python -m experiments.disruption_recovery.sensitivity --count 30 --seed 20261111 --output sensitivity_repeat.json
          cmp sensitivity_synthetic.json sensitivity_repeat.json
          rm sensitivity_repeat.json
      - name: Retain synthetic study result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-sensitivity-synthetic
          path: sensitivity_synthetic.json
          retention-days: 14
          if-no-files-found: warn
