name: BTS HTTPS certificate smoke (research)
on:
  pull_request:
    paths:
      - "ingest/transtats.py"
      - "tests/test_transtats_tls.py"
      - ".github/workflows/bts_tls_smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tls-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Verify official BTS webform TLS without downloading datasets
        run: |
          python - <<'PY'
          import requests
          url = ("https://www.transtats.bts.gov/DL_SelectFields.aspx"
                 "?gnoyr_VQ=FMG&QO_fu146_anzr=Nrgj14x_Yno")
          # Requests verifies certificate chains by default; demand it explicitly.
          r = requests.get(url, timeout=45, verify=True)
          r.raise_for_status()
          assert 'id="form1"' in r.text, "BTS selection form not present"
          print("BTS HTTPS certificate verification and form retrieval passed")
          PY
