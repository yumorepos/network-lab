name: Stage B T-100 pilot
on:
  push:
    branches: [research/stage-b-t100-july-2026]
  pull_request:
    paths:
      - scripts/stage_b_t100_pilot.py
      - tests/test_stage_b_t100_pilot.py
      - docs/STAGE_B_T100_2026_07.md
      - .github/workflows/stage_b_t100_pilot.yml
permissions:
  contents: read
jobs:
  isolated-month:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: pip install -r requirements.txt -q
      - name: Validate offline negative controls
        run: pytest tests/test_stage_b_t100_pilot.py -q
      - name: Download and check the two official source-year ZIPs
        run: python -m scripts.stage_b_t100_pilot --output-dir "$RUNNER_TEMP/networklab-stage-b"
      - name: Publish small research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-t100-pilot-diagnostics
          path: |
            ${{ runner.temp }}/networklab-stage-b/summary.json
            ${{ runner.temp }}/networklab-stage-b/july_yoy_operator_segment.csv
          if-no-files-found: ignore
          retention-days: 7
