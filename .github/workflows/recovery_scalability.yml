name: Recovery solver scalability (bounded research)
on:
  pull_request:
    paths:
      - "experiments/disruption_recovery/recovery.py"
      - "experiments/disruption_recovery/scalability.py"
      - "experiments/disruption_recovery/benchmark.py"
      - "tests/test_recovery_scalability.py"
      - ".github/workflows/recovery_scalability.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing requirements
        run: python -m pip install -q -r requirements.txt
      - name: Regression and safety tests
        run: python -m pytest -q tests/test_disruption_recovery_experiment.py tests/test_recovery_scalability.py
      - name: Evaluate ten bounded synthetic cases (no raw data)
        run: |
          python -m experiments.disruption_recovery.scalability \
            --cases 2 --sizes 5 8 11 --path-cap 15000 --wall-seconds 6 \
            --output recovery_scalability_v1.json
      - name: Conditional larger-size stress check (14 flights; failures are data)
        run: |
          python -m experiments.disruption_recovery.scalability \
            --cases 1 --sizes 14 --path-cap 15000 --wall-seconds 6 \
            --output recovery_scalability_stress_14.json
      - name: Controlled factor audit at eight flights (same seeded routes)
        run: |
          python -m experiments.disruption_recovery.scalability \
            --cases 1 --sizes 8 --tails 3 --delay-choices 6 \
            --path-cap 15000 --wall-seconds 6 --output recovery_factor_8_3tails_6delays.json
          python -m experiments.disruption_recovery.scalability \
            --cases 1 --sizes 8 --tails 2 --delay-choices 3 \
            --path-cap 15000 --wall-seconds 6 --output recovery_factor_8_2tails_3delays.json
          python -m experiments.disruption_recovery.scalability \
            --cases 1 --sizes 8 --tails 3 --delay-choices 3 \
            --path-cap 15000 --wall-seconds 6 --output recovery_factor_8_3tails_3delays.json
      - name: Retain source-free aggregate evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-scalability-aggregate-v1
          path: |
            recovery_scalability_v1.json
            recovery_scalability_stress_14.json
            recovery_factor_8_3tails_6delays.json
            recovery_factor_8_2tails_3delays.json
            recovery_factor_8_3tails_3delays.json
          if-no-files-found: warn
          retention-days: 7
