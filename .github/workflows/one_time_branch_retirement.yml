name: One-time owner-authorized remote branch retirement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one_time_branch_retirement.yml']
permissions:
  contents: write
jobs:
  retire:
    if: github.repository == 'yumorepos/network-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retire 34 exact stale refs and preserve main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH_TIPS: '{"audit/airport-impact-db1c-stop-portfolio-2026-10-28":"71a8cde580890ee1d225af0f92acd5e7fc96542c","audit/airport-label-consistency-20261029":"5d0a1aa3e4e779f78c87d932edbde6f9681f18af","audit/carrier-vintage-source-correction-2026-10-28":"e3e16f38094c8f5a964036492c0e21cfa7e70d48","audit/economics-sanity-2026-10-28":"d88eacd6689b9e112d653d996aa04cc5fe1eff4a","audit/hub-cbsa-source-exposure-20261109":"2edd2c3bb3e6ea6dbff8c4858f5e06f6991b64b6","audit/live-artifact-parity-source-coverage-2026-10-28":"4aba060f320447097e4bff2dd002d8c2f114d6e0","audit/local-warehouse-country-preflight-20261029":"d19050fa928bc80480f7d967495867f87fb20b84","audit/mac-airport-label-counterfactual-20261029":"c8e0a5a44c9c7f681b8f586314eaa159ba979d88","audit/mac-country-conflict-fact-exposure-20261029":"2edcbcc9957ab4204fb567397f133cc0e6201c21","audit/negative-controls-and-doc-conventions-2026-10-28":"339283a760f6687d90f8fb427c9863938f99bde2","audit/preserved-mac-warehouse-readonly-2026-10-28":"155bb9055da5fedc3311cab39b37dc6c0b9a6d6b","claude/network-lab-finalization":"5a97bdcc71f2b7d600e30cb8d4d7fb6b39a488ed","design/dark-dashboard-preview-20261028":"a786c79ed4e3bcf099f96cf97d5a87ad983c6687","design/dashboard-desktop-qa-20261109":"933a126ea112e9a0cf38167d9ff4eb652f126898","design/dashboard-portfolio-alignment-20261109":"3a7260000e62e324792a7ad85dc923d76465b459","docs/network-lab-audit-handoff-20261109":"993894a7fcc334e65fb7e0b069925625c4f0d164","experiment/disruption-recovery-correctness-20261029":"78494a9f6bcf821c32efff3cb64600359e381748","fix/paired-airport-market-label-20261029":"f795ee512b29b8b0ac664c316e48424533222398","phase5/milestone-a-integrity":"e5f0e550c62c6ac19044f9c8593c6a55e061cf40","research/airport-identity-archive-audit-20261029":"d840d0f7576841364b66d10ebcf0bf9051576ab0","research/cross-source-country-exposure-20261029":"5e75ee4a700dc60b3bb53a915a07b402d3a42326","research/derived-cbsa-preflight-20261029":"8dbba643e0df13e04d7c8f70c2f33a855e0b8618","research/source-id-vs-legacy-market-audit-20261029":"967462e060b4fd4b3f8cd9d1b0d015203f06aacb","research/source-stable-airport-id-20261029":"e22db762663d7e250117cfbfbfda890226408bc0","research/stage-b-t100-july-2026":"f1405a9611ef6d6c3f5d5c8a695ece081855ca19","research/stage-c-db1c-compat-2026-10-28":"d969e90814f3a81b8f6f2f5edfa7515b8e15127d","research/t100-2024-consumer-envelope-20261029":"68626d8045e57f8b4cd3d2c1555a701b161668aa","research/t100-2024-exact-field-parity-20261029":"35ac87ceecb66a6b0ba7196d1a2c61d9b52c3ee3","research/t100-cross-vintage-ids-20261029":"1a2bf0e2d0532c04be05fbf86a115821ed9126b9","research/t100-multivintage-airport-identity-20261029":"4350e50b9cdd844a5cf05eca88b42b9d226eaa11","security/bts-tls-verification-20261029":"43267f7f2a362a3f8afb2dfd1dd8e4a4b8d4e9c0","security/ingest-common-tls-20261029":"fa6c55213cd496648de5418f95c9491641c4c43e","ui/mobile-header-typography-2026-10-28":"c25f45975915b6dbbf8220c2547b068dfe8e4efe","upgrade/provenance-gates-20261028":"03d3b62ea939c9ac1927b11c363251a6c304f70c"}'
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error, urllib.parse
          base = "https://api.github.com/repos/yumorepos/network-lab"
          expected = json.loads(os.environ["EXPECTED_BRANCH_TIPS"])
          if len(expected) != 34 or "main" in expected:
              raise SystemExit("Refusing unsafe branch selection")
          if any(len(v)!=40 or not all(c in "0123456789abcdef" for c in v) for v in expected.values()):
              raise SystemExit("Refusing invalid expected SHA")
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }
          def request(path, method="GET"):
              req = urllib.request.Request(base+path, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp) if method == "GET" else None
          repo = request("")
          if repo.get("default_branch") != "main":
              raise SystemExit("Default branch changed; stopping")
          removed, skipped, failed = [], [], []
          for name, sha in sorted(expected.items()):
              url = "/git/ref/heads/" + urllib.parse.quote(name, safe="/")
              try:
                  current = request(url)
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      skipped.append((name, "already absent")); continue
                  failed.append((name, "GET HTTP " + str(e.code))); continue
              found = current.get("object", {}).get("sha")
              if found != sha:
                  skipped.append((name, "head moved; preserve: " + str(found)))
                  continue
              try:
                  request(url.replace("/git/ref/heads/", "/git/refs/heads/", 1), method="DELETE")
                  removed.append(name)
              except urllib.error.HTTPError as e:
                  failed.append((name, "DELETE HTTP " + str(e.code)))
          remaining = [x["name"] for x in request("/branches?per_page=100")]
          print("Removed refs:", len(removed), removed)
          print("Skipped refs:", len(skipped), skipped)
          print("Failures:", failed)
          print("Remaining branches:", remaining)
          if failed or remaining != ["main"]:
              raise SystemExit("Branch retirement incomplete; investigate skipped/failed refs")
          print("SUCCESS: exactly one remote branch, main")
          PY
